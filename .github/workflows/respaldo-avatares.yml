# Copia semanal de las fotos de perfil (Supabase Storage) a un repositorio PRIVADO de respaldo.
# No se guardan en este repositorio porque es público (GitHub Pages) y son fotos de estudiantes.
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   SUPABASE_URL          https://<proyecto>.supabase.co
#   SUPABASE_SERVICE_KEY  clave secret/service_role de Supabase (nunca en el código del sitio)
#   RESPALDO_REPO         dueño/nombre del repo privado, ej. sistemasoperativosusmp-cell/sisope-respaldos
#   RESPALDO_TOKEN        token fine-grained con permiso "Contents: Read and write" solo sobre ese repo
name: Respaldo de avatares
on:
  schedule: [{ cron: '0 6 * * 1' }]   # lunes 01:00 hora de Lima
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  respaldo:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar avatares al repositorio privado
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          REPO: ${{ secrets.RESPALDO_REPO }}
          TOKEN: ${{ secrets.RESPALDO_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ] || [ -z "$REPO" ] || [ -z "$TOKEN" ]; then echo "Faltan secretos: no se hace nada."; exit 0; fi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/$REPO.git" respaldo
          mkdir -p respaldo/avatares
          curl -sf -X POST "$URL/storage/v1/object/list/avatares" -H "Authorization: Bearer $KEY" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"prefix":"","limit":1000,"offset":0}' > lista.json
          for n in $(jq -r '.[].name | select(endswith(".webp"))' lista.json); do curl -sf "$URL/storage/v1/object/public/avatares/$n" -o "respaldo/avatares/$n"; done
          cd respaldo
          git config user.name "sisope-bot"; git config user.email "sisope-bot@users.noreply.github.com"
          git add avatares
          if git diff --cached --quiet; then echo "Sin cambios"; else git commit -m "Respaldo de avatares $(date +%F)"; git push; fi
