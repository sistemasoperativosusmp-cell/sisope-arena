<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SISOPE Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=202611112043">
</head>
<body class="arena">
<header class="top">
  <div class="pix">SISOPE ARENA</div>
  <div class="live"><i></i>EN VIVO</div>
  <div class="who"><span id="quien"></span><button class="btn ghost" onclick="salir()">Salir</button></div>
</header>
<main>
  <div style="display:flex;flex-direction:column;gap:20px">
    <section class="panel" id="yo"><h2 class="pix">MI PERFIL</h2><div class="empty">Cargando…</div></section>
    <section class="panel"><h2 class="pix">RANKING</h2><div id="ranking"></div></section>
  </div>
  <div style="display:flex;flex-direction:column;gap:20px">
    <section class="panel" style="border:3px solid var(--red)"><h2 class="pix" style="color:#ff8a8a">VÍCTIMAS DEL JUEGO DEL MIEDO</h2>
      <p style="color:#ffd0d0;font-weight:700;font-size:13px;margin:0 0 10px">Serán los primeros en recibir preguntas. Participa para salir de la lista.</p>
      <div class="vict" id="victimas"></div></section>
    <section class="panel"><h2 class="pix" style="color:#c9b2f5">CONSULTORAS</h2><div id="consultoras"></div></section>
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js?v=202611112043"></script>
<script src="assets/comun.js?v=202611112043"></script>
<script>
let MI_ALIAS = null;
async function iniciar() {
  const ses = await sesionORedirigir(); if (!ses) return;
  if (await esDocente()) { $('#quien').innerHTML = esc(ses.user.email) + ' · <a href="docente.html" style="color:#f2b705">Panel docente</a>'; }
  else $('#quien').textContent = ses.user.email;
  const { data: yo } = await sb.from('jugadores').select('alias').eq('correo', ses.user.email.toLowerCase()).maybeSingle();
  MI_ALIAS = yo?.alias || null;
  await refrescar();
  sb.channel('pulso').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'pulso' }, refrescar).subscribe();
  const { data: cfg } = await sb.from('config').select('valor').eq('clave', 'RefrescoSegundos').maybeSingle();
  setInterval(refrescar, Math.max(20, Number(cfg?.valor || 60)) * 1000);
}
async function refrescar() {
  const [{ data: r, error }, { data: c }, { data: n }] = await Promise.all([
    sb.from('v_ranking').select('*').order('posicion'),
    sb.from('v_ranking_consultoras').select('*').order('posicion'),
    sb.from('v_notas').select('p1,p2,p3,p4,ep_final,ef_final,pf').eq('alias', MI_ALIAS || '-').maybeSingle()
  ]);
  if (error) { toast('Error al leer ranking: ' + error.message, true); return; }
  const yo = (r || []).find(x => x.alias === MI_ALIAS);
  $('#yo').innerHTML = '<h2 class="pix">MI PERFIL</h2>' + (yo ? `
    <div class="me">${yo.avatar_url ? `<img class="avatar" src="${esc(yo.avatar_url)}" alt="Avatar de ${esc(yo.alias)}">` : '<div class="avatar"></div>'}
      <div style="flex:1;min-width:220px">
        <div style="font-size:28px;font-weight:800">${esc(yo.alias)}</div>
        <div style="color:#b8c2e6;font-weight:700">${esc(yo.consultora || '')} · ${esc(yo.rol_consultora || '')}</div>
        <div style="margin-top:8px;font-weight:800">Nivel ${yo.nivel} · ${esc(yo.rango)} · Puesto ${yo.posicion}</div>
        <div class="bar"><div style="width:${Math.round((yo.progreso || 0) * 100)}%"></div></div>
        <div style="font-weight:800">${yo.xp} / ${yo.xp_siguiente ?? 'MAX'} XP${yo.siguiente_rango ? ' · siguiente: ' + esc(yo.siguiente_rango) : ''}</div>
        ${n ? `<div style="margin-top:8px;color:#d6dcf2;font-weight:700">P1 ${n.p1} · P2 ${n.p2} · P3 ${n.p3} · P4 ${n.p4} · Parcial ${n.ep_final ?? '—'} · Final ${n.ef_final ?? '—'} · Promedio ${n.pf}</div>` : ''}
      </div></div>` : '<div class="empty">Tu cuenta aún no está vinculada a un jugador. Avisa a tu docente.</div>');
  $('#ranking').innerHTML = (r || []).map(x => `<div class="rank ${x.alias === MI_ALIAS ? 'yo' : ''}"><span class="pos">${x.posicion}</span><span class="al">${esc(x.alias)}</span><span style="flex:1;color:#b8c2e6;font-size:13px;font-weight:700">${esc(x.rango)}</span><span class="hoy">${x.xp_hoy >= 0 ? '+' : ''}${x.xp_hoy} hoy</span><span class="xp">${x.xp} XP</span></div>`).join('') || '<div class="empty">Sin jugadores.</div>';
  const v = (r || []).filter(x => x.victima);
  $('#victimas').innerHTML = v.map(x => `<span>${esc(x.alias)}</span>`).join('') || '<span style="background:transparent;border:0">Nadie por ahora</span>';
  $('#consultoras').innerHTML = (c || []).map(x => `<div class="rank"><span class="pos">${x.posicion}</span><span class="al">${esc(x.consultora)}</span><span class="xp">${x.xp} XP</span></div>`).join('');
}
iniciar();
</script>
</body>
</html>
