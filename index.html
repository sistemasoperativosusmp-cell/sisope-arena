<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SISOPE Arena · Ingresar</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=202611122332">
</head>
<body>
<div class="login">
  <form class="box" id="f">
    <h1 class="pix">SISOPE ARENA</h1>
    <p>Sistemas Operativos y Plataformas · USMP</p>
    <label>Correo institucional<input id="email" type="email" autocomplete="username" required placeholder="nombre@usmp.pe"></label>
    <label>Contraseña<input id="pass" type="password" autocomplete="current-password" required></label>
    <button class="btn pix" id="go" type="submit">INGRESAR</button>
    <div class="msg" id="msg" role="alert"></div>
    <button type="button" class="olvide" id="olvide">¿Olvidaste tu contraseña?</button>
  </form>
  <form class="box hide" id="fr">
    <h1 class="pix">RECUPERAR ACCESO</h1>
    <p>Escribe tu correo institucional y te enviaremos un enlace para crear una nueva contraseña.</p>
    <label>Correo institucional<input id="remail" type="email" autocomplete="username" required placeholder="nombre@usmp.pe"></label>
    <button class="btn pix" id="rgo" type="submit">ENVIAR ENLACE</button>
    <div class="msg ok" id="rmsg" role="status"></div>
    <button type="button" class="olvide" id="volver">← Volver a ingresar</button>
  </form>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js?v=202611122332"></script>
<script src="assets/comun.js?v=202611122332"></script>
<script>
async function destino() { location.replace((await esDocente()) ? 'docente.html' : 'alumno.html'); }
sb.auth.getSession().then(({ data }) => { if (data.session) destino(); });
$('#f').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#msg').textContent = ''; $('#go').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: $('#email').value.trim().toLowerCase(), password: $('#pass').value });
  $('#go').disabled = false;
  if (error) { $('#msg').textContent = /invalid/i.test(error.message) ? 'Correo o contraseña incorrectos.' : 'No se pudo ingresar: ' + error.message; return; }
  destino();
});
$('#olvide').onclick = () => { $('#f').classList.add('hide'); $('#fr').classList.remove('hide'); $('#remail').value = $('#email').value; $('#remail').focus(); };
$('#volver').onclick = () => { $('#fr').classList.add('hide'); $('#f').classList.remove('hide'); };
$('#fr').addEventListener('submit', async (e) => {
  e.preventDefault(); $('#rgo').disabled = true; $('#rmsg').textContent = '';
  const destinoReset = location.href.replace(/[^/]*([?#].*)?$/, '') + 'reset.html';
  const { error } = await sb.auth.resetPasswordForEmail($('#remail').value.trim().toLowerCase(), { redirectTo: destinoReset });
  $('#rgo').disabled = false;
  if (error) { $('#rmsg').classList.remove('ok'); $('#rmsg').textContent = /rate|seconds/i.test(error.message) ? 'Espera unos minutos antes de pedir otro enlace.' : 'No se pudo enviar: ' + error.message; return; }
  $('#rmsg').classList.add('ok'); $('#rmsg').textContent = 'Si el correo está registrado, te llegará un enlace en unos minutos. Revisa también la carpeta de spam.';
});
</script>
</body>
</html>
