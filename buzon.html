<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SISOPE Arena · Buzón</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=202611130940">
</head>
<body>
<header class="top">
  <div class="pix">SISOPE ARENA · DOCENTE</div>
  <div class="pills"><span>Buzón de alumnos</span></div>
  <div class="who"><span id="quien"></span><button class="btn ghost" onclick="salir()">Salir</button></div>
</header>
<nav class="tabs" id="nav"></nav>
<main>
  <section class="card">
    <h2 class="pix" id="tit">BUZÓN DE ALUMNOS</h2>
    <div class="bzf" id="filtros">
      <button data-f="nuevos" class="on">Sin leer <b id="cNuevos"></b></button>
      <button data-f="todos">Todos <b id="cTodos"></b></button>
      <select id="fCat"><option value="">Todas las categorías</option><option>Comentario</option><option>Sugerencia</option><option>Duda</option><option>Felicitación</option><option>Problema</option></select>
      <button class="sbtn" onclick="marcarTodos()">✓ Marcar todo como leído</button>
    </div>
    <div id="lista"><div class="empty">Cargando…</div></div>
    <p class="help">Los alumnos escriben desde <b>Mi perfil → Escríbele a tu docente</b> (máximo 5 mensajes por día). Los <b>anónimos</b> no guardan quién los envió, por eso no se pueden responder. Tu respuesta la ve solo el alumno que escribió.</p>
  </section>
</main>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js?v=202611130940"></script>
<script src="assets/comun.js?v=202611130940"></script>
<script>
let M = [], FILTRO = 'nuevos';
const ICON = { Comentario: '💬', Sugerencia: '💡', Duda: '❓', Felicitación: '🎉', Problema: '⚠️' };
async function iniciar() {
  const ses = await sesionORedirigir(); if (!ses) return;
  if (!(await esDocente())) { location.replace('alumno.html'); return; }
  $('#quien').textContent = ses.user.email;
  await cargarSeccion(); if (!SECC) { toast('Crea una sección en Ajustes', true); return; }
  $('#tit').textContent = 'BUZÓN DE ALUMNOS · ' + SECC.nombre;
  await cargar();
}
async function cargar() {
  const { data, error } = await sb.from('mensajes').select('*, jugadores(nombre, alias, avatar_url)').eq('seccion_id', SECC.id).order('creado', { ascending: false });
  if (error) { $('#lista').innerHTML = `<div class="empty">${/relation|schema cache/i.test(error.message) ? 'Falta ejecutar el script 18 en Supabase.' : esc(error.message)}</div>`; return; }
  M = data || []; pintar(); contarBuzon();
}
function pintar() {
  const cat = $('#fCat').value, vis = M.filter(m => (FILTRO === 'todos' || !m.leido) && (!cat || m.categoria === cat));
  $('#cNuevos').textContent = M.filter(m => !m.leido).length || ''; $('#cTodos').textContent = M.length || '';
  const f = x => new Date(x).toLocaleString('es-PE', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  $('#lista').innerHTML = vis.length ? vis.map(m => {
    const j = m.jugadores, quien = m.anonimo ? '<b>Anónimo</b>' : `<b>${esc(j?.nombre || '—')}</b> <small>${esc(j?.alias || '')}</small>`;
    const av = !m.anonimo && j?.avatar_url ? `<img class="alav" src="${esc(avatarSrc(j.avatar_url))}" alt="">` : `<div class="alav ini">${m.anonimo ? '?' : esc((j?.alias || '?').replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase())}</div>`;
    return `<div class="bzm ${m.leido ? '' : 'nuevo'}" data-id="${m.id}">${av}<div class="bzc"><div class="bzh">${quien}<span class="bzcat">${ICON[m.categoria] || ''} ${esc(m.categoria)}</span><small>${f(m.creado)}</small></div><p>${esc(m.texto)}</p>
      ${m.anonimo ? '' : `<div class="bzr"><textarea rows="2" maxlength="800" placeholder="Responder (solo lo verá este alumno)…">${esc(m.respuesta || '')}</textarea><button class="sbtn" onclick="responder(${m.id}, this)">${m.respuesta ? 'Actualizar respuesta' : 'Responder'}</button></div>`}
      ${m.respuesta && m.respondido ? `<small class="bzok">✓ Respondido el ${f(m.respondido)}</small>` : ''}</div>
      <div class="bza"><button class="sbtn mini" title="${m.leido ? 'Marcar como no leído' : 'Marcar como leído'}" onclick="leido(${m.id}, ${!m.leido})">${m.leido ? '↺' : '✓'}</button><button class="sbtn mini" title="Borrar" onclick="borrar(${m.id})">🗑</button></div></div>`;
  }).join('') : `<div class="empty">${FILTRO === 'nuevos' ? 'No hay mensajes sin leer. 👍' : 'Aún no hay mensajes.'}</div>`;
}
async function leido(id, v) { const { error } = await sb.from('mensajes').update({ leido: v }).eq('id', id); if (error) { toast('No se guardó: ' + error.message, true); return; } M.find(m => m.id === id).leido = v; pintar(); contarBuzon(); }
async function responder(id, btn) {
  const t = btn.previousElementSibling.value.trim();
  const { error } = await sb.from('mensajes').update({ respuesta: t || null, respondido: t ? new Date().toISOString() : null, leido: true }).eq('id', id);
  if (error) { toast('No se guardó: ' + error.message, true); return; }
  Object.assign(M.find(m => m.id === id), { respuesta: t || null, respondido: t ? new Date().toISOString() : null, leido: true }); toast(t ? 'Respuesta enviada' : 'Respuesta borrada'); pintar(); contarBuzon();
}
async function borrar(id) { if (!confirm('¿Borrar este mensaje?')) return; const { error } = await sb.from('mensajes').delete().eq('id', id); if (error) { toast('No se borró: ' + error.message, true); return; } M = M.filter(m => m.id !== id); pintar(); contarBuzon(); }
async function marcarTodos() { const ids = M.filter(m => !m.leido).map(m => m.id); if (!ids.length) return; const { error } = await sb.from('mensajes').update({ leido: true }).in('id', ids); if (error) { toast('No se guardó: ' + error.message, true); return; } M.forEach(m => m.leido = true); pintar(); contarBuzon(); }
document.querySelectorAll('#filtros button[data-f]').forEach(b => b.onclick = () => { FILTRO = b.dataset.f; document.querySelectorAll('#filtros button[data-f]').forEach(x => x.classList.toggle('on', x === b)); pintar(); });
$('#fCat').onchange = pintar;
iniciar();
</script>
</body>
</html>
